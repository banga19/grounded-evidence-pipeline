name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run demo pipeline (offline corpus, no API keys)
        run: |
          python -m src.pipeline --query "How does Kenya regulate AI and personal data?" --top-k 3

      - name: Run tests
        run: pytest -q
